{{- if and .Values.ingress.enabled .Values.liveViewer.enabled }}
# Browser viewer of the live (HLS), behind HTTP basic auth. The Secret `liveViewer.authSecret`
# (key `users`, htpasswd format) is created outside the chart so no password lives in git.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: live-auth
spec:
  basicAuth:
    secret: {{ .Values.liveViewer.authSecret }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sada.fullname" . }}-live
  labels:
    {{- include "sada.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-live-auth@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: receiver
                port:
                  name: hls
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "sada.fullname" .)) }}
  {{- end }}
{{- end }}
