# Inside the cluster: the orchestrators read rtsp://receiver:8554/live/<slug>.
# The name of this Service is part of the contract with the back office (SADA_RELAY_HOST).
apiVersion: v1
kind: Service
metadata:
  name: receiver
  labels:
    {{- include "sada.labels" . | nindent 4 }}
    app.kubernetes.io/component: receiver
spec:
  type: ClusterIP
  ports:
    - name: rtsp
      port: {{ .Values.receiver.rtspPort }}
      targetPort: rtsp
      protocol: TCP
    - name: rtmp
      port: {{ .Values.receiver.rtmpPort }}
      targetPort: rtmp
      protocol: TCP
    - name: srt
      port: {{ .Values.receiver.srtPort }}
      targetPort: srt
      protocol: UDP
    - name: hls
      port: 8888
      targetPort: hls
      protocol: TCP
    # control room monitors: WHEP signalling and stream health, read by the back office only
    - name: whep
      port: 8889
      targetPort: whep
      protocol: TCP
    - name: api
      port: 9997
      targetPort: api
      protocol: TCP
  selector:
    {{- include "sada.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: receiver
---
# Public ingest (1935/tcp, 8890/udp) and WebRTC media of the control room monitors (ICE, udp):
# k3s ServiceLB binds them on the node, the Hetzner firewall decides who may reach them. RTSP,
# HLS, WHEP signalling and the API stay inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-receiver" (include "sada.fullname" .) }}
  labels:
    {{- include "sada.labels" . | nindent 4 }}
    app.kubernetes.io/component: receiver
  {{- with .Values.receiver.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.receiver.service.type }}
  externalTrafficPolicy: {{ .Values.receiver.service.externalTrafficPolicy }}
  {{- with .Values.receiver.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  ports:
    - name: rtmp
      port: {{ .Values.receiver.rtmpPort }}
      targetPort: rtmp
      protocol: TCP
    - name: srt
      port: {{ .Values.receiver.srtPort }}
      targetPort: srt
      protocol: UDP
    - name: ice
      port: {{ .Values.receiver.webrtc.udpPort }}
      targetPort: ice
      protocol: UDP
  selector:
    {{- include "sada.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: receiver
