{{- if .Values.kubeletScrape.enabled }}
# Read-only identity for the monitoring VM's Prometheus: scrapes the kubelet /metrics and
# /metrics/cadvisor endpoints (pod CPU/memory). The kubelet authorizes these paths with the
# "nodes/metrics" subresource only; nothing else is granted (no nodes/proxy, no API objects).
# The long-lived token lives in the Secret below; read it on the operator's machine, never commit it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubelet-scrape
  labels:
    {{- include "sada.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-kubelet-scrape
  labels:
    {{- include "sada.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-kubelet-scrape
  labels:
    {{- include "sada.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-kubelet-scrape
subjects:
  - kind: ServiceAccount
    name: kubelet-scrape
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: kubelet-scrape-token
  annotations:
    kubernetes.io/service-account.name: kubelet-scrape
  labels:
    {{- include "sada.labels" . | nindent 4 }}
{{- end }}
