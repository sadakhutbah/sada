# Sadā on one k3s node (Hetzner cx33): back office, stream receiver, one orchestrator per mosque.
#
#   helm upgrade --install sada ./deploy/helm/sada -n sada --create-namespace \
#     --set image.tag=<git sha> \
#     --set mosques[0].slug=masjid-al-nour --set mosques[0].tokenSecret=sada-masjid-al-nour
#
# Services are named `backoffice` and `receiver` on purpose: the back office tells the
# orchestrators to read the stream on rtsp://receiver:8554, and MediaMTX asks its publish
# authorisation to http://backoffice:8090. Install the chart in its own namespace.

# Image of the Python application (back office and orchestrators share it). Build it with
# `make front` then `docker build .`, push it to your registry, and set the tag.
image:
  repository: ghcr.io/thesadaproject/sada
  tag: "" # "" = appVersion of the chart; use the git sha in production
  pullPolicy: IfNotPresent

imagePullSecrets: []

# /app/data: recordings, orchestrator state, uploads. One ReadWriteOnce volume is enough
# because every pod lands on the same node (local-path provisioner on top of the Hetzner
# volume mounted by Ansible).
persistence:
  enabled: true
  existingClaim: ""
  accessMode: ReadWriteOnce
  size: 20Gi
  storageClass: "" # "" = cluster default StorageClass (local-path on k3s)
  mountPath: /app/data

# The image runs as uid/gid 10001. fsGroup goes on every pod that mounts the data volume, and a
# root init container chowns the volume (local-path ignores fsGroup).
securityContext:
  fsGroup: 10001

# Échantillonneur de consommation (CPU/mémoire par pod, CSV du jour dans <data>/metrics) : sert à dimensionner.
metrics:
  enabled: false
  every: 15

# Identité en lecture seule (nodes/metrics) pour que Prometheus (VM de supervision, via Tailscale)
# scrape kubelet/cAdvisor : CPU et mémoire par pod. Jeton longue durée dans le Secret kubelet-scrape-token.
kubeletScrape:
  enabled: false

backoffice:
  replicas: 1
  port: 8090
  # "" = automatic: Secure cookies when the Ingress serves HTTPS.
  secureCookies: ""
  # Proxies whose X-Forwarded-For / X-Real-IP are believed (the public page's rate limit counts the real
  # visitor). "" = loopback and private ranges (the Traefik pod); a comma-separated list of CIDRs replaces it.
  trustedProxies: ""
  # Behind the Cloudflare proxy: CF-Connecting-IP is believed only when the right-most outside hop of
  # X-Forwarded-For is a Cloudflare address. "" = Cloudflare's published ranges built into the code.
  cloudflareProxies: ""
  # One name for the RTMP and SRT ingest shown to OBS (grey cloud in DNS: Cloudflare does not proxy it).
  # "" = ingest.sadakhutbah.org (hosted platform).
  ingestHost: ""
  # Where the public pages/API are reached from outside (absolute addresses on public documents, such
  # as the QR code of the PDF calendar). "" = the instance address, then the request's.
  publicBaseUrl: ""
  # Host names served ("" = any). When set, include the console host AND the in-cluster names the pods
  # use ("backoffice", "backoffice.<namespace>.svc"), or the orchestrators lose the back office.
  allowedHosts: ""
  # Host names served for /api/v1/public/ only, e.g. "sadakhutbah.org" (the Worker's host). "" = none.
  publicHosts: ""
  # Automatic import of finished runs, in seconds (0 = disabled).
  importEvery: 60
  # Search by meaning (multilingual-e5-small, int8 ONNX, ~135 MB on the data volume, ~0.5 GB RSS once
  # loaded). Runs inside the back-office on one ONNX thread, only between lives; false = words and verses only.
  semanticSearch: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 5Gi
      cpu: 4 # plafond : un habillage ne doit pas affamer les directs (les orchestrateurs réservent 1,5 cœur chacun)
  # Telemetry (metrics + traces over OTLP/HTTP) is off unless an endpoint is set. Example, towards a
  # collector reachable on a private network only:
  #   - name: OTEL_EXPORTER_OTLP_ENDPOINT
  #     value: http://otel-collector.tailnet.example:4318
  #   - name: OTEL_EXPORTER_OTLP_HEADERS   # if the collector needs it; keep it in a Secret
  #     valueFrom: {secretKeyRef: {name: otel-auth, key: headers}}
  # See deploy/README.md, "Telemetry".
  extraEnv: []

# Stream reception (MediaMTX): mosques push RTMP or SRT, orchestrators read RTSP inside
# the cluster. Published on the node through k3s ServiceLB (1935/tcp, 8890/udp).
receiver:
  image: bluenviron/mediamtx:1
  imagePullPolicy: IfNotPresent
  # "" = the mediamtx.yml shipped in the chart (files/mediamtx.yml).
  config: ""
  existingConfigMap: ""
  rtmpPort: 1935
  srtPort: 8890
  rtspPort: 8554
  # WebRTC for the control room monitors. The HTTP signalling stays internal (the back office
  # proxies it); only the ICE media port is published, in UDP, on the node.
  webrtc:
    udpPort: 8189
    # Public address(es) of the node, announced to browsers as ICE candidates (IP or hostname).
    # Required in production: without it browsers only get the pod's address and fall back to HLS.
    additionalHosts: []
  service:
    type: LoadBalancer
    annotations: {}
    loadBalancerIP: ""
    externalTrafficPolicy: Local
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi

# One orchestrator Deployment + Service per entry of `mosques`.
orchestrator:
  replicas: 1
  apiPort: 8088
  # "" = http://backoffice:8090
  backofficeUrl: ""
  # Output frame rate of the programme (lower it on a small node)
  fps: 30
  resources:
    requests:
      cpu: 1500m
      memory: 1Gi
    limits:
      memory: 3Gi
  # Telemetry (metrics + traces over OTLP/HTTP) is off unless an endpoint is set. Example, towards a
  # collector reachable on a private network only:
  #   - name: OTEL_EXPORTER_OTLP_ENDPOINT
  #     value: http://otel-collector.tailnet.example:4318
  #   - name: OTEL_EXPORTER_OTLP_HEADERS   # if the collector needs it; keep it in a Secret
  #     valueFrom: {secretKeyRef: {name: otel-auth, key: headers}}
  # See deploy/README.md, "Telemetry".
  extraEnv: []

# Each mosque gets an orchestrator and an API service `orchestrator-<slug>:8088`.
# The token is the one printed by `python -m sada.backoffice mosque --slug <slug> --agent-token`,
# stored in a Secret of this namespace (key `token` unless secretKey says otherwise).
mosques: []
#  - slug: masjid-al-nour
#    tokenSecret: sada-masjid-al-nour
#    secretKey: token

database:
  # cnpg     = PostgreSQL managed by CloudNativePG (in-cluster, single instance)
  # external = PostgreSQL elsewhere (`url`, or `existingSecret` + key)
  # sqlite   = no PostgreSQL: SQLite file under /app/data (single back office, no HA)
  mode: cnpg
  url: ""
  existingSecret: ""
  existingSecretKey: uri
  cnpg:
    name: "" # "" = <fullname>-postgres
    instances: 1
    # "" = the image the installed operator defaults to (recommended).
    imageName: ""
    storage:
      size: 10Gi
      storageClass: "" # "" = cluster default (local-path, on the Hetzner volume)
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 2Gi

ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: console.sadakhutbah.org
  path: /
  tls:
    enabled: true
    secretName: "" # "" = <fullname>-tls, filled by cert-manager
    issuer: letsencrypt-prod
    # issuer: "" = no cert-manager annotation: bring your own certificate in secretName (e.g. a
    # Cloudflare Origin CA certificate, see deploy/cloudflare/PLAN.md). secretName is then required.

# ClusterIssuer. Cluster-scoped: create it once per cluster. solver: http01 (default, through
# Traefik: needs 80 reachable from the Internet, so NOT compatible with the Cloudflare proxy) or
# dns01 (Cloudflare API: survives the proxy). See deploy/cloudflare/PLAN.md.
#   --set certManager.createIssuer=true --set certManager.email=you@example.org
certManager:
  createIssuer: false
  email: ""
  server: https://acme-v02.api.letsencrypt.org/directory
  solver: http01
  dns01:
    cloudflare:
      # Secret in the cert-manager namespace (cluster resource namespace), created by hand:
      # never in git. Token scoped to Zone:DNS:Edit on the sadakhutbah.org zone only.
      apiTokenSecretName: ""
      apiTokenSecretKey: api-token
    # Optional: limit the solver to these zones, e.g. ["sadakhutbah.org"]
    dnsZones: []

# Clock of the containers (sessions, dars, logs)
timezone: Europe/Paris
