# Hand-written inventory, only to try the playbook without Terraform (syntax check, dry run).
[server]
sada-app ansible_host=203.0.113.10 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_ed25519

[server:vars]
sada_public_ip=203.0.113.10
sada_data_device=/dev/disk/by-id/scsi-0HC_Volume_000000
sada_data_mount=/mnt/sada-data
sada_k3s_storage_path=/mnt/sada-data/k3s
sada_kubeconfig_path=~/.config/sada-deploy/kubeconfig
