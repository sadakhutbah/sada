[project]
name = "minbar-live"
version = "0.1.0"
description = "Minbar Live : diffusion automatique de la khutba + pipeline IA post-live"
requires-python = ">=3.10"
dependencies = [
  "requests",
  "webrtcvad-wheels",
  "numpy",
  "pillow",
  "rapidfuzz",
  "faster-whisper",
  "pyzmq",
  "arabic-reshaper",
  "python-bidi",
  "pytest",
  # back-office
  "fastapi",
  "uvicorn",
  "jinja2",
  "python-multipart",
  "argon2-cffi",
  "httpx",
]
[tool.setuptools]
packages = ["minbar", "minbar.pipeline", "minbar.backoffice"]
[tool.setuptools.package-data]
"minbar.backoffice" = ["templates/*.html", "static/*", "static/fonts/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
