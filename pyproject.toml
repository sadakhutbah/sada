[project]
name = "minbar-live"
version = "0.1.0"
description = "Minbar Live : diffusion automatique de la khutba + pipeline IA post-live"
requires-python = ">=3.10"
dependencies = [
  "requests",
  "boto3",
  "webrtcvad-wheels",
  "opencv-python-headless",
  "numpy",
  "pillow",
  "rapidfuzz",
  "faster-whisper",
  "pyzmq",
  "arabic-reshaper",
  "python-bidi",
  "tzdata; platform_system == 'Windows'",
  "pytest",
  # back-office
  "fastapi[standard]",
  "uvicorn",
  "python-multipart",
  "argon2-cffi",
  "httpx",
  "sqlalchemy>=2.0",
  "wordfreq>=3.1.1",
]
[tool.setuptools]
packages = ["minbar", "minbar.pipeline", "minbar.backoffice"]
[tool.setuptools.package-data]
"minbar.backoffice" = ["templates/*.html", "static/*", "static/fonts/*"]
"minbar" = ["models/*.onnx"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.fastapi]
entrypoint = "minbar.backoffice.asgi:app"

