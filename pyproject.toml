[project]
name = "sada"
license = "AGPL-3.0-or-later"
version = "0.1.0"
description = "Sadā: automatic live streaming of the Friday khutba, with an AI pipeline for transcripts, Qur'an verses, translations and clips"
requires-python = ">=3.10"
dependencies = [
  "requests",
  "boto3",
  "webrtcvad-wheels",
  "opencv-python-headless",
  "numpy",
  "pillow",
  "rapidfuzz",
  "faster-whisper",
  "pyzmq",
  "arabic-reshaper",
  "python-bidi",
  "tzdata; platform_system == 'Windows'",
  "pytest",
  # back-office
  "fastapi[standard]",
  "uvicorn",
  "python-multipart",
  "argon2-cffi",
  "httpx",
  "sqlalchemy>=2.0",
  "wordfreq>=3.1.1",
]
[tool.setuptools]
packages = ["sada", "sada.pipeline", "sada.backoffice"]
[tool.setuptools.package-data]
"sada.backoffice" = ["templates/*.html", "static/*", "static/fonts/*"]
"sada" = ["models/*.onnx"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.fastapi]
entrypoint = "sada.backoffice.asgi:app"

