[project]
name = "sada"
license = "AGPL-3.0-or-later"
version = "0.1.0"
description = "Sadā: automatic live streaming of the Friday khutba, with an AI pipeline for transcripts, Qur'an verses, translations and clips"
requires-python = ">=3.10"
dependencies = [
  "requests",
  "boto3",
  "webrtcvad-wheels",
  "opencv-python-headless",
  "numpy",
  "praytimes>=2.3.2",  # PrayTimes.org algorithm (LGPL-3.0, compatible with the AGPL): calculated prayer times
  "pillow",
  "rapidfuzz",
  "faster-whisper",
  "pyzmq",
  "arabic-reshaper",
  "python-bidi",
  "tzdata; platform_system == 'Windows'",
  # back-office
  "fastapi[standard]",
  "uvicorn",
  "python-multipart",
  "argon2-cffi",
  "httpx",
  "sqlalchemy>=2.0.58",
  "wordfreq>=3.1.1",
  "psycopg[binary]>=3.3.9",
  "opentelemetry-sdk>=1.45.2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
]
[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = ["sada", "sada.pipeline", "sada.backoffice"]
[tool.setuptools.package-data]
"sada.backoffice" = ["templates/*.html", "static/*", "static/fonts/*"]
"sada" = ["models/*.onnx", "locales/*/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.fastapi]
entrypoint = "sada.backoffice.asgi:app"


[tool.ruff]
line-length = 120
extend-exclude = ["web", "site", "promo", "promo2", "promo3", "pitch"]

[tool.ruff.lint]
# Ruff defaults (pyflakes + core pycodestyle), sorted imports, bugbear, pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
