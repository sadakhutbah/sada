name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # never cancel a main run: it may carry a release whose image must be built
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Python lint + format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx ruff@0.17.5 check --output-format=github .
      - run: uvx ruff@0.17.5 format --check .

  python:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          # bounded retries: a stalled mirror must fail fast instead of hanging the job
          for attempt in 1 2 3; do
            if sudo timeout 150 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -q \
              && sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -yq --no-install-recommends ffmpeg; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "ffmpeg install failed after 3 attempts" >&2; exit 1; }
            echo "apt attempt $attempt failed, retrying in 10s" >&2; sleep 10
          done
          ffmpeg -version | head -1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv venv .venv && uv pip install -p .venv/bin/python -e . --group dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the front end (served by the back office, checked by the route tests)
        run: npm --prefix web ci && npm --prefix web run build
      - name: Download the rendering engine
        run: .venv/bin/python -c "from sada.backoffice.template_render import fetch_engine; fetch_engine()"
      - name: Test
        run: .venv/bin/python -m pytest -q

  web:
    name: Front end (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  audit:
    name: Dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: pip-audit (locked dependencies)
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit (production dependencies)
        run: npm --prefix web audit --omit=dev --audit-level=high

  release:
    name: Release (release-please)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Docker image (ghcr)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, python, web, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci && npm --prefix web run build
      # main-<run number>-<short sha>: an orderable tag, picked up by Flux image automation
      # (ImagePolicy in the private gitops repo selects the highest run number).
      # A release adds its semver tag (Flux deploys those); other main builds stay main-<run>-<sha>.
      - id: tag
        env:
          CREATED: ${{ needs.release.outputs.created }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          short="${GITHUB_SHA::7}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          if [ "$CREATED" = "true" ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "extra=ghcr.io/${GITHUB_REPOSITORY}:$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=main-${GITHUB_RUN_NUMBER}-$short" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SADA_VERSION=${{ steps.tag.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:main-${{ github.run_number }}-${{ steps.tag.outputs.short }}
            ghcr.io/${{ github.repository }}:latest
            ${{ steps.tag.outputs.extra }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
