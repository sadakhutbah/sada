name: Infra

# Terraform and Helm chart checks. Validation only: nothing is planned against real accounts,
# nothing is applied or deployed from here.
on:
  pull_request:
    paths:
      - "deploy/terraform/**"
      - "deploy/helm/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "deploy/terraform/**"
      - "deploy/helm/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  helm:
    name: Helm (lint, template, kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: lint and render every CI values file
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for f in deploy/helm/sada/ci/*.yaml; do
            echo "== $f"
            helm lint deploy/helm/sada -f "$f"
            helm template sada deploy/helm/sada -f "$f" | ./kubeconform -strict -ignore-missing-schemas -summary
          done
